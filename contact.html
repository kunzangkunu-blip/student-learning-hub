<h2>Frequently Asked Questions</h2>

<div class="faq">
    <button class="faq-btn">What courses do you offer?</button>
    <p class="faq-answer">We offer Web Development, Programming and Database courses.</p>
</div>

<div class="faq">
    <button class="faq-btn">Are the courses online?</button>
    <p class="faq-answer">Yes, all courses are available online.</p>
</div>

<div class="faq">
    <button class="faq-btn">Do I receive a certificate?</button>
    <p class="faq-answer">Yes, students receive a certificate after completion.</p>
</div>
<main>

    <h2>Contact Us</h2>

    <form id="contactForm">

        <label for="name">Name:</label>
        <input type="text" id="name">

        <label for="email">Email:</label>
        <input type="email" id="email">

        <label for="message">Message:</label>
        <textarea id="message"></textarea>

        <button type="submit">Send Message</button>

    </form>

</main>
